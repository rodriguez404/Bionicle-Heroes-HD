[Textures]
; 1 = replace the game's textures with the HD ones in Folder (made by tools\build_pack.py)
Enabled = 1
; folder with <key>.dds files, relative to the game folder (or a full path)
Folder = BionicleHeroesHD\textures

[Debug]
; 1 = write every texture the game loads to BionicleHeroesHD.log (key, size, replaced or not)
LogTextures = 0
; 1 = save every texture the game loads to BionicleHeroesHD\dump\<key>.dds (to build packs from)
DumpTextures = 0
